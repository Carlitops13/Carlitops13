name: Generate Contribution Animations

on:
  schedule:
    # Se ejecuta cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Genera la animación de Pacman
      - name: Generate Pacman Animation
        uses: platane/snk@v3
        with:
          github_user_name: Carlitops13
          outputs: |
            dist/pacman-contribution-graph.svg?mode=pacman
            dist/pacman-contribution-graph-dark.svg?palette=github-dark&mode=pacman

      # Genera la animación tradicional de Snake
      - name: Generate Snake Animation
        uses: platane/snk@v3
        with:
          github_user_name: Carlitops13
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publica ambos resultados en la rama "output"
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
