name: Generate Pacman Animation

on:
  schedule:
    # Se ejecuta cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Pacman animation
        uses: platane/snk@v3
        id: pacman
        with:
          github_user_name: Carlitops13
          outputs: |
            dist/pacman-contribution-graph.svg?mode=pacman
            dist/pacman-contribution-graph-dark.svg?palette=github-dark&mode=pacman

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.6.1
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
